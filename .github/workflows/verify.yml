name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loja_test
          POSTGRES_PASSWORD: loja_test_ci
          POSTGRES_DB: loja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja_test -d loja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://loja_test:loja_test_ci@localhost:5432/loja_test
      DATABASE_SSL: "false"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Conferir dependências declaradas
        run: npm ls --depth=0
      - name: Verificar tipos, lint, formatação, testes e build
        run: npm run verify
